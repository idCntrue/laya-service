# Force a deliberate choice rather than a blank text box, and route security
# reports away from the public tracker.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/idCntrue/laya-service/security/advisories/new
    about: Report privately. Do not open a public issue for security problems.
  - name: Question or usage help
    url: https://github.com/idCntrue/laya-service/discussions
    about: Ask here if you are not sure whether something is a bug.
  - name: API reference
    url: https://github.com/idCntrue/laya-service/blob/main/API.en.md
    about: Endpoint documentation, error codes, and call examples.
